# ==============================================================================
# Render Infrastructure Blueprint - Dual Environment (Dev & Prod)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Development Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: economic-dashboard-dev
    runtime: docker
    plan: free
    branch: develop
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: economic-dashboard-db-dev
          property: connectionString
      - key: FORCE_MOCK
        value: "false"
      - key: BCRA_USE_MOCKS
        value: "false"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "10"

  # ----------------------------------------------------------------------------
  # 2. Production Web Service (Independent Copy)
  # ----------------------------------------------------------------------------
  - type: web
    name: economic-dashboard-prod
    runtime: docker
    plan: starter
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: economic-dashboard-db-prod
          property: connectionString
      - key: FORCE_MOCK
        value: "false"
      - key: BCRA_USE_MOCKS
        value: "false"
      - key: DB_POOL_SIZE
        value: "15"
      - key: DB_MAX_OVERFLOW
        value: "30"

databases:
  # ----------------------------------------------------------------------------
  # 1. Development PostgreSQL Database
  # ----------------------------------------------------------------------------
  - name: economic-dashboard-db-dev
    plan: free
    databaseName: economic_dashboard_dev
    user: postgres

  # ----------------------------------------------------------------------------
  # 2. Production PostgreSQL Database (Independent Copy)
  # ----------------------------------------------------------------------------
  - name: economic-dashboard-db-prod
    plan: starter
    databaseName: economic_dashboard_prod
    user: postgres
