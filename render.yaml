services:
  - type: web
    name: economic-dashboard
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: economic-dashboard-db
          property: connectionString
      - key: FORCE_MOCK
        value: "false"
      - key: BCRA_USE_MOCKS
        value: "false"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "10"

databases:
  - name: economic-dashboard-db
    plan: free
    databaseName: economic_dashboard
    user: postgres
