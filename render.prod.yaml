# ==============================================================================
# Render Infrastructure Blueprint - Production Environment Only (Independent Copy)
# ==============================================================================

services:
  - type: web
    name: economic-dashboard-prod
    runtime: docker
    plan: starter
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: economic-dashboard-db-prod
          property: connectionString
      - key: FORCE_MOCK
        value: "false"
      - key: BCRA_USE_MOCKS
        value: "false"
      - key: DB_POOL_SIZE
        value: "15"
      - key: DB_MAX_OVERFLOW
        value: "30"

databases:
  - name: economic-dashboard-db-prod
    plan: starter
    databaseName: economic_dashboard_prod
    user: postgres
