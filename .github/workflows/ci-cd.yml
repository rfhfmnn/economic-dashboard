name: CI/CD Pipeline

on:
  push:
    branches: [main, master, dev, develop]
  pull_request:
    branches: [main, master, dev, develop]
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - development
          - production
          - all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  # ============================================================================
  # Stage 1: Parallel Backend & Frontend Unit/Lint/Type Tests
  # ============================================================================
  test-backend:
    name: Backend Unit & Route Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-cov httpx pyyaml

      - name: Ensure frontend dist placeholder
        run: |
          mkdir -p frontend/dist
          echo '<!DOCTYPE html><html><head><title>Test</title></head><body><div id="root"></div></body></html>' > frontend/dist/index.html

      - name: Run Backend Unit Tests (Pytest)
        env:
          PYTHONPATH: .
        run: |
          # Run backend unit tests, ignoring docker-compose live integration tests
          python -m pytest backend/tests/ --ignore=backend/tests/test_docker_compose.py -v

  test-frontend:
    name: Frontend Unit & Build Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Lint / Typecheck
        run: |
          cd frontend
          npm run lint

      - name: Run Frontend Tests (Vitest)
        run: |
          cd frontend
          npm run test

      - name: Run TypeScript & Vite Production Build
        run: |
          cd frontend
          npm run build

  # ============================================================================
  # Stage 2: Docker Compose Integration & End-to-End Tests
  # ============================================================================
  integration-and-e2e:
    name: Docker Compose Integration & E2E Tests
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (Test Runner)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test runner dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx pyyaml

      - name: Validate Production Docker Compose Configuration
        run: |
          echo "🔍 Validating docker-compose.prod.yaml schema and config..."
          docker compose -f docker-compose.prod.yaml config

      - name: Build and Start Development Docker Compose Stack
        run: |
          echo "🚀 Building and starting containerized dev stack..."
          docker compose up -d --build

      - name: Wait for Containers & Healthcheck
        run: |
          echo "⏳ Waiting for app and database containers to reach healthy state..."
          timeout 120s bash -c 'until curl -sf http://localhost:8000/health | grep -q "\"status\":\"ok\""; do
            echo "Waiting for container /health endpoint (5s)..."
            sleep 5
          done'
          echo "✅ Containers are healthy!"
          docker compose ps

      - name: Run Integration & E2E Tests Against Live Containers
        env:
          PYTHONPATH: .
          DOCKER_APP_URL: "http://localhost:8000"
          REQUIRE_DOCKER: "1"
        run: |
          echo "🧪 Executing test_docker_compose.py and test_e2e_integration.py..."
          python -m pytest backend/tests/test_docker_compose.py backend/tests/test_e2e_integration.py -v

      - name: Dump Docker Logs on Failure
        if: failure()
        run: |
          echo "⚠️ Integration tests failed! Dumping container logs for debugging:"
          docker compose logs --tail=200

      - name: Tear Down Docker Compose Stack
        if: always()
        run: |
          echo "🛑 Stopping and removing containers and volumes..."
          docker compose down -v

  # ============================================================================
  # Stage 3: Build & Push Container Image to Registry
  # ============================================================================
  build-image:
    name: Build & Push Image to Registry
    needs: [integration-and-e2e]
    if: |
      ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/develop') && github.event_name == 'push') ||
      github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_base: ${{ steps.meta.outputs.image_base }}
      image_uri: ${{ steps.meta.outputs.image_uri }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute Image Tag and Registry Metadata
        id: meta
        run: |
          # Compute short commit sha (7 characters)
          SHORTSHA=$(git rev-parse --short=7 HEAD 2>/dev/null | cut -c1-7 || echo "${GITHUB_SHA:-0000000}" | cut -c1-7)
          # Format UTC timestamp: YYYYMMDD-HHMMSS
          TIMESTAMP=$(date -u +'%Y%m%d-%H%M%S')
          # Tag pattern: YYYYMMDD-HHMMSS-shortsha (e.g., 20260818-163457-83242da)
          IMAGE_TAG="${TIMESTAMP}-${SHORTSHA}"
          
          # Container registry repository in lowercase
          IMAGE_BASE="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_URI="${IMAGE_BASE}:${IMAGE_TAG}"

          echo "=========================================================="
          echo "🏷️ Image Tag Generated: ${IMAGE_TAG}"
          echo "📦 Image Target URI:     ${IMAGE_URI}"
          echo "=========================================================="

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_base=${IMAGE_BASE}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.image_uri }}
            ${{ steps.meta.outputs.image_base }}:latest
            ${{ (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/develop') && format('{0}:dev-latest', steps.meta.outputs.image_base) || '' }}
            ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && format('{0}:prod-latest', steps.meta.outputs.image_base) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record Build Summary
        run: |
          echo "## 📦 Image Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag:** \`${{ steps.meta.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry URI:** \`${{ steps.meta.outputs.image_uri }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag Pattern:** \`YYYYMMDD-HHMMSS-shortsha\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Pushed to Registry:** ${{ github.event_name != 'pull_request' }}" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Stage 4A: Deploy to Development Environment (Pull & Serve Image)
  # ============================================================================
  deploy-dev:
    name: Deploy to Development (Pull & Serve)
    needs: [build-image]
    if: |
      ((github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/develop') && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target_env == 'development' || github.event.inputs.target_env == 'all'))
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      RENDER_DEPLOY_ROLE_ARN: ${{ secrets.RENDER_DEPLOY_ROLE_ARN_DEV || secrets.RENDER_DEPLOY_ROLE_ARN }}
      OIDC_ROLE_ARN: ${{ secrets.OIDC_ROLE_ARN_DEV || secrets.OIDC_ROLE_ARN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Script Permissions
        run: chmod +x scripts/validate_deployment.sh

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Development Image from Registry
        run: |
          IMAGE_URI="${{ needs.build-image.outputs.image_uri }}"
          IMAGE_BASE="${{ needs.build-image.outputs.image_base }}"

          echo "=========================================================="
          echo "📥 Pulling Dev Image from Registry: ${IMAGE_URI}"
          echo "=========================================================="
          docker pull "${IMAGE_URI}"

          echo "🏷️ Tagging as dev-current in registry for tracking..."
          docker tag "${IMAGE_URI}" "${IMAGE_BASE}:dev-current"
          docker push "${IMAGE_BASE}:dev-current"

      # Optional Cloud OIDC Role Assumption (AWS / GCP / Cloud IAM)
      - name: Authenticate Cloud Role via GitHub OIDC
        if: env.RENDER_DEPLOY_ROLE_ARN != '' || env.OIDC_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.RENDER_DEPLOY_ROLE_ARN || env.OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          audience: sts.amazonaws.com

      - name: Mint GitHub OIDC Token for Deployment Verification
        id: oidc
        run: |
          echo "Requesting GitHub OIDC Token for Development..."
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            OIDC_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=render.com" | jq -r '.value // empty')
            if [ -n "$OIDC_TOKEN" ]; then
              echo "✅ Successfully acquired GitHub OIDC JWT token."
              echo "::add-mask::$OIDC_TOKEN"
              echo "token_acquired=true" >> "$GITHUB_OUTPUT"
            else
              echo "token_acquired=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "token_acquired=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Render Development Deployment (Serve Pulled Image)
        id: trigger-deploy-dev
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL_DEV || secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID_DEV || secrets.RENDER_SERVICE_ID }}
        run: |
          echo "=========================================================="
          echo "🚀 Triggering Deployment on Render (DEVELOPMENT)..."
          echo " Serving Image: ${{ needs.build-image.outputs.image_uri }}"
          echo "=========================================================="

          DEPLOY_TRIGGERED=false
          IMAGE_URI="${{ needs.build-image.outputs.image_uri }}"

          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "📡 Deploying via Render Deploy Hook URL with imgURL..."
            ENCODED_IMAGE=$(python3 -c "import urllib.parse; print(urllib.parse.quote('${IMAGE_URI}'))")
            SEPARATOR="?"
            if [[ "$RENDER_DEPLOY_HOOK_URL" == *"?"* ]]; then
              SEPARATOR="&"
            fi
            RESPONSE=$(curl -sS -X POST "${RENDER_DEPLOY_HOOK_URL}${SEPARATOR}imgURL=${ENCODED_IMAGE}")
            echo "Response: $RESPONSE"
            DEPLOY_TRIGGERED=true
          elif [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID" ]; then
            echo "📡 Deploying via Render REST API (Service ID: $RENDER_SERVICE_ID) with imageUrl..."
            RESPONSE=$(curl -sS -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -d "{\"imageUrl\": \"${IMAGE_URI}\", \"clearCache\": \"do_not_clear\"}")
            echo "Response: $RESPONSE"
            DEPLOY_TRIGGERED=true
          else
            echo "ℹ️ Neither RENDER_DEPLOY_HOOK_URL_DEV nor (RENDER_API_KEY + RENDER_SERVICE_ID_DEV) configured."
            echo "Image pulled and tagged as dev-current."
            DEPLOY_TRIGGERED=true
          fi

          echo "deploy_triggered=$DEPLOY_TRIGGERED" >> "$GITHUB_OUTPUT"

      - name: Validate Development Deployment via Health Endpoint
        env:
          RENDER_APP_URL: ${{ vars.RENDER_APP_URL_DEV || secrets.RENDER_APP_URL_DEV || vars.RENDER_APP_URL || secrets.RENDER_APP_URL }}
          TIMEOUT_SECONDS: ${{ vars.DEPLOY_TIMEOUT_SECONDS || 300 }}
        run: |
          if [ -z "$RENDER_APP_URL" ]; then
            echo "ℹ️ Notice: Development RENDER_APP_URL not configured. Skipping health probe."
            exit 0
          fi

          echo "=========================================================="
          echo "🩺 Validating Development Deployment Health Probe"
          echo " Target Application: $RENDER_APP_URL"
          echo "=========================================================="
          ./scripts/validate_deployment.sh "$RENDER_APP_URL" "$TIMEOUT_SECONDS"

  # ============================================================================
  # Stage 4B: Deploy to Production Environment (Pull & Serve Image)
  # ============================================================================
  deploy-prod:
    name: Deploy to Production (Pull & Serve)
    needs: [build-image]
    if: |
      ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target_env == 'production' || github.event.inputs.target_env == 'all'))
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      RENDER_DEPLOY_ROLE_ARN: ${{ secrets.RENDER_DEPLOY_ROLE_ARN_PROD || secrets.RENDER_DEPLOY_ROLE_ARN }}
      OIDC_ROLE_ARN: ${{ secrets.OIDC_ROLE_ARN_PROD || secrets.OIDC_ROLE_ARN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Script Permissions
        run: chmod +x scripts/validate_deployment.sh

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Production Image from Registry
        run: |
          IMAGE_URI="${{ needs.build-image.outputs.image_uri }}"
          IMAGE_BASE="${{ needs.build-image.outputs.image_base }}"

          echo "=========================================================="
          echo "📥 Pulling Prod Image from Registry: ${IMAGE_URI}"
          echo "=========================================================="
          docker pull "${IMAGE_URI}"

          echo "🏷️ Tagging as prod-current in registry for tracking..."
          docker tag "${IMAGE_URI}" "${IMAGE_BASE}:prod-current"
          docker push "${IMAGE_BASE}:prod-current"

      # Optional Cloud OIDC Role Assumption (AWS / GCP / Cloud IAM)
      - name: Authenticate Cloud Role via GitHub OIDC
        if: env.RENDER_DEPLOY_ROLE_ARN != '' || env.OIDC_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.RENDER_DEPLOY_ROLE_ARN || env.OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          audience: sts.amazonaws.com

      - name: Mint GitHub OIDC Token for Deployment Verification
        id: oidc
        run: |
          echo "Requesting GitHub OIDC Token for Production..."
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            OIDC_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=render.com" | jq -r '.value // empty')
            if [ -n "$OIDC_TOKEN" ]; then
              echo "✅ Successfully acquired GitHub OIDC JWT token."
              echo "::add-mask::$OIDC_TOKEN"
              echo "token_acquired=true" >> "$GITHUB_OUTPUT"
            else
              echo "token_acquired=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "token_acquired=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Render Production Deployment (Serve Pulled Image)
        id: trigger-deploy-prod
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL_PROD || secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID_PROD || secrets.RENDER_SERVICE_ID }}
        run: |
          echo "=========================================================="
          echo "🚀 Triggering Deployment on Render (PRODUCTION)..."
          echo " Serving Image: ${{ needs.build-image.outputs.image_uri }}"
          echo "=========================================================="

          DEPLOY_TRIGGERED=false
          IMAGE_URI="${{ needs.build-image.outputs.image_uri }}"

          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "📡 Deploying via Render Deploy Hook URL with imgURL..."
            ENCODED_IMAGE=$(python3 -c "import urllib.parse; print(urllib.parse.quote('${IMAGE_URI}'))")
            SEPARATOR="?"
            if [[ "$RENDER_DEPLOY_HOOK_URL" == *"?"* ]]; then
              SEPARATOR="&"
            fi
            RESPONSE=$(curl -sS -X POST "${RENDER_DEPLOY_HOOK_URL}${SEPARATOR}imgURL=${ENCODED_IMAGE}")
            echo "Response: $RESPONSE"
            DEPLOY_TRIGGERED=true
          elif [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID" ]; then
            echo "📡 Deploying via Render REST API (Service ID: $RENDER_SERVICE_ID) with imageUrl..."
            RESPONSE=$(curl -sS -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -d "{\"imageUrl\": \"${IMAGE_URI}\", \"clearCache\": \"do_not_clear\"}")
            echo "Response: $RESPONSE"
            DEPLOY_TRIGGERED=true
          else
            echo "ℹ️ Neither RENDER_DEPLOY_HOOK_URL_PROD nor (RENDER_API_KEY + RENDER_SERVICE_ID_PROD) configured."
            echo "Image pulled and tagged as prod-current."
            DEPLOY_TRIGGERED=true
          fi

          echo "deploy_triggered=$DEPLOY_TRIGGERED" >> "$GITHUB_OUTPUT"

      - name: Validate Production Deployment via Health Endpoint
        env:
          RENDER_APP_URL: ${{ vars.RENDER_APP_URL_PROD || secrets.RENDER_APP_URL_PROD || vars.RENDER_APP_URL || secrets.RENDER_APP_URL }}
          TIMEOUT_SECONDS: ${{ vars.DEPLOY_TIMEOUT_SECONDS || 300 }}
        run: |
          if [ -z "$RENDER_APP_URL" ]; then
            echo "ℹ️ Notice: Production RENDER_APP_URL not configured. Skipping health probe."
            exit 0
          fi

          echo "=========================================================="
          echo "🩺 Validating Production Deployment Health Probe"
          echo " Target Application: $RENDER_APP_URL"
          echo "=========================================================="
          ./scripts/validate_deployment.sh "$RENDER_APP_URL" "$TIMEOUT_SECONDS"
