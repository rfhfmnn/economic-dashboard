name: Promote Dev to Production

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Development source branch to promote"
        required: true
        default: "dev"
        type: string
      target_branch:
        description: "Production target branch"
        required: true
        default: "master"
        type: string
      skip_tests:
        description: "Skip pre-promotion automated test suite (emergency hotfix only)"
        required: false
        default: false
        type: boolean
      deploy_production:
        description: "Trigger production deployment on Render and validate healthcheck"
        required: false
        default: true
        type: boolean
      release_tag:
        description: "Optional semantic release tag (e.g., v1.1.0)"
        required: false
        default: ""
        type: string

concurrency:
  group: promote-dev-to-production
  cancel-in-progress: false

jobs:
  # ============================================================================
  # Stage 1: Pre-Promotion Validation & Smoke Tests
  # ============================================================================
  validate-dev-branch:
    name: Validate Dev Health Prior to Promotion
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source branch (${{ inputs.source_branch }})
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_branch }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-cov httpx pyyaml

      - name: Ensure frontend dist placeholder
        run: |
          mkdir -p frontend/dist
          echo '<!DOCTYPE html><html><head><title>Test</title></head><body><div id="root"></div></body></html>' > frontend/dist/index.html

      - name: Run Backend Unit & Infrastructure Tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest backend/tests/ --ignore=backend/tests/test_docker_compose.py -v

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Lint & Unit Tests
        run: |
          cd frontend
          npm run lint
          npm run test

      - name: Verify Frontend Production Build
        run: |
          cd frontend
          npm run build

  # ============================================================================
  # Stage 2: Merge Dev into Production & Tag Release
  # ============================================================================
  merge-and-promote:
    name: Merge Dev into Production
    needs: [validate-dev-branch]
    if: always() && (needs.validate-dev-branch.result == 'success' || inputs.skip_tests)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository with full git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch Remote Branches
        run: |
          git fetch origin ${{ inputs.source_branch }}:${{ inputs.source_branch }}
          git fetch origin ${{ inputs.target_branch }}:${{ inputs.target_branch }}

      - name: Merge Source into Target Branch
        id: git-merge
        run: |
          echo "=========================================================="
          echo " Merging ${{ inputs.source_branch }} -> ${{ inputs.target_branch }}"
          echo "=========================================================="

          git checkout ${{ inputs.target_branch }}
          git pull origin ${{ inputs.target_branch }}

          # Check if there are changes to merge
          COMMITS_BEHIND=$(git rev-list --count ${{ inputs.target_branch }}..${{ inputs.source_branch }})
          echo "Commits to promote: $COMMITS_BEHIND"

          if [ "$COMMITS_BEHIND" -eq 0 ]; then
            echo "ℹ️ Target branch ${{ inputs.target_branch }} is already up-to-date with ${{ inputs.source_branch }}."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "🔀 Executing merge..."
            git merge --no-ff "${{ inputs.source_branch }}" -m "chore(release): promote ${{ inputs.source_branch }} to ${{ inputs.target_branch }} [run: #${{ github.run_number }}]"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag Release (Optional)
        id: git-tag
        if: inputs.release_tag != ''
        run: |
          TAG="${{ inputs.release_tag }}"
          echo "🏷️ Tagging commit with release: $TAG"
          git tag -a "$TAG" -m "Production release $TAG promoted from ${{ inputs.source_branch }}"
          echo "tag_created=true" >> "$GITHUB_OUTPUT"

      - name: Push Changes & Tags to Target Branch
        run: |
          echo "🚀 Pushing promoted changes to origin/${{ inputs.target_branch }}..."
          git push origin ${{ inputs.target_branch }}

          if [ -n "${{ inputs.release_tag }}" ]; then
            git push origin "${{ inputs.release_tag }}"
          fi

      - name: Record Promotion Summary
        run: |
          echo "## 🚀 Promotion Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Source Branch:** \`${{ inputs.source_branch }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Branch:** \`${{ inputs.target_branch }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Tag:** \`${{ inputs.release_tag || 'None' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Merge Status:** Successful" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered By:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Stage 3: Trigger Production Deployment on Render & Validate Health
  # ============================================================================
  deploy-promoted-production:
    name: Deploy & Validate Promoted Production
    needs: [merge-and-promote]
    if: inputs.deploy_production
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      RENDER_DEPLOY_ROLE_ARN: ${{ secrets.RENDER_DEPLOY_ROLE_ARN_PROD || secrets.RENDER_DEPLOY_ROLE_ARN }}
      OIDC_ROLE_ARN: ${{ secrets.OIDC_ROLE_ARN_PROD || secrets.OIDC_ROLE_ARN }}

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}

      - name: Set Script Permissions
        run: chmod +x scripts/validate_deployment.sh

      # Optional Cloud OIDC Role Assumption
      - name: Authenticate Cloud Role via GitHub OIDC
        if: env.RENDER_DEPLOY_ROLE_ARN != '' || env.OIDC_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.RENDER_DEPLOY_ROLE_ARN || env.OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          audience: sts.amazonaws.com

      - name: Mint GitHub OIDC Token for Deployment Verification
        id: oidc
        run: |
          echo "Requesting GitHub OIDC Token for Production Promotion..."
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            OIDC_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=render.com" | jq -r '.value // empty')
            if [ -n "$OIDC_TOKEN" ]; then
              echo "✅ Successfully acquired GitHub OIDC JWT token."
              echo "::add-mask::$OIDC_TOKEN"
              echo "token_acquired=true" >> "$GITHUB_OUTPUT"
            else
              echo "token_acquired=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "token_acquired=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Render Production Deployment
        id: trigger-deploy-prod
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL_PROD || secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID_PROD || secrets.RENDER_SERVICE_ID }}
        run: |
          echo "=========================================================="
          echo "🚀 Triggering Deployment on Render (PRODUCTION)..."
          echo "=========================================================="

          DEPLOY_TRIGGERED=false

          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "📡 Deploying via Render Deploy Hook URL..."
            RESPONSE=$(curl -sS -X POST "$RENDER_DEPLOY_HOOK_URL")
            echo "Response: $RESPONSE"
            DEPLOY_TRIGGERED=true
          elif [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID" ]; then
            echo "📡 Deploying via Render REST API (Service ID: $RENDER_SERVICE_ID)..."
            RESPONSE=$(curl -sS -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -d '{"clearCache": "do_not_clear"}')
            echo "Response: $RESPONSE"
            DEPLOY_TRIGGERED=true
          else
            echo "ℹ️ Neither RENDER_DEPLOY_HOOK_URL_PROD nor (RENDER_API_KEY + RENDER_SERVICE_ID_PROD) configured."
            echo "Assuming Render Git auto-deploy is enabled for branch: ${{ inputs.target_branch }}."
            DEPLOY_TRIGGERED=true
          fi

          echo "deploy_triggered=$DEPLOY_TRIGGERED" >> "$GITHUB_OUTPUT"

      - name: Validate Production Healthcheck Probe
        env:
          RENDER_APP_URL: ${{ vars.RENDER_APP_URL_PROD || secrets.RENDER_APP_URL_PROD || vars.RENDER_APP_URL || secrets.RENDER_APP_URL }}
          TIMEOUT_SECONDS: ${{ vars.DEPLOY_TIMEOUT_SECONDS || 300 }}
        run: |
          if [ -z "$RENDER_APP_URL" ]; then
            echo "ℹ️ Notice: Production RENDER_APP_URL not configured. Skipping health probe."
            exit 0
          fi

          echo "=========================================================="
          echo "🩺 Validating Production Deployment Health Probe"
          echo " Target Application: $RENDER_APP_URL"
          echo "=========================================================="
          ./scripts/validate_deployment.sh "$RENDER_APP_URL" "$TIMEOUT_SECONDS"
