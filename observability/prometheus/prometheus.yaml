global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'economic-dashboard-observability'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'otel-collector-telemetry'
    static_configs:
      - targets: ['otel-collector:8888']

  - job_name: 'otel-collector-metrics'
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']
