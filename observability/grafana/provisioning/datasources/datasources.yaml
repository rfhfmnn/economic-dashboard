apiVersion: 1

datasources:
  # Prometheus metrics datasource (Default)
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
    editable: true

  # Grafana Tempo distributed tracing datasource
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      httpMethod: GET
      serviceMap:
        datasourceUid: prometheus
      search:
        hide: false
      nodeGraph:
        enabled: true
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        tags: ['service.name', 'job']
        filterByTrace: true
        filterBySpan: true
        customQuery: true
        query: '{$${__tags}} |= "$${__trace.id}"'
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        tags: [{ key: 'service.name', value: 'service_name' }]
        queries:
          - name: 'Request Rate'
            query: 'sum(rate(http_server_duration_milliseconds_count{$$__tags}[$$__rate_interval]))'
    editable: true

  # Grafana Loki structured log datasource
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      derivedFields:
        - matcherRegex: 'trace_id[=:\s"]+([0-9a-fA-F]+)'
          name: TraceID
          url: '$${__value.raw}'
          datasourceUid: tempo
        - matcherRegex: 'traceparent[=:\s"]+00-([0-9a-fA-F]{32})-'
          name: TraceIDFromParent
          url: '$${__value.raw}'
          datasourceUid: tempo
    editable: true
